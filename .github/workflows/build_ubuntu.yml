name: Build Linux

on: [pull_request]

jobs:
  appimage-builder:
    name: Linux AppImage Build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libgtk-3-dev libxkbcommon-dev \
            libunwind-dev libfuse2

      - name: Install dependencies from BuildLinux.sh
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        run: sudo chown $USER -R ./

      - name: Build dependencies
        run: ./BuildLinux.sh -dsr

      - name: Build BambuStudio
        run: ./BuildLinux.sh -ir

      - uses: actions/upload-artifact@v4
        with:
          name: BambuStudio_Linux_arm64_24.04
          path: './build/BambuStudio_ubu64.AppImage'
