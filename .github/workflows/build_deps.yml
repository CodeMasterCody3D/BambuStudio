name: Build Deps

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  build_deps:
    name: Build Deps
    if: inputs.build-deps-only || inputs.valid-cache != true
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git \
            libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev \
            libosmesa6-dev libsoup2.4-dev libwebkit2gtk-4.1-dev \
            nasm yasm libx264-dev gettext curl

      - name: Build dependencies
        run: |
          mkdir -p deps/build_${{ inputs.arch }}/BambuStudio_dep_${{ inputs.arch }}
          cd deps/build_${{ inputs.arch }}
          cmake ../../deps -DDESTDIR=./BambuStudio_dep_${{ inputs.arch }}
          make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BambuStudio_dep_${{ inputs.os }}_${{ inputs.arch }}
          path: deps/build_${{ inputs.arch }}/BambuStudio_dep_${{ inputs.arch }}
